<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1"><title>Flow.io · Petites cartes</title><style>
:root{color-scheme:light;--primary-text-color:#202124;--secondary-text-color:#60656d;--primary-color:#0074b8;--error-color:#b3261e;--success-color:#2e7d32;--divider-color:#d8dde3;--card-background-color:#fff;--secondary-background-color:#f3f5f7;--ha-card-border-radius:18px;--blue-color:#0288d1;--cyan-color:#00acc1;--amber-color:#ffa000;--orange-color:#f4511e;--purple-color:#8e24aa;background:#eef1f5;color:var(--primary-text-color);font-family:system-ui,sans-serif}
:root.dark{color-scheme:dark;--primary-text-color:#e6eaf0;--secondary-text-color:#a3adba;--primary-color:#69c7ff;--error-color:#ffb4ab;--divider-color:#39424e;--card-background-color:#202833;--secondary-background-color:#27313e;background:#141a22}body{margin:0;padding:20px}main{max-width:560px;margin:auto;display:flex;flex-direction:column;gap:20px}nav{display:flex;flex-wrap:wrap;gap:12px}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;padding:8px}
</style></head><body><main><h1>Flow.io · Petites cartes</h1><p>Données fictives, sans connexion HA ni MQTT. Aperçu des cartes indépendantes.</p><nav><label>Préfixe<select id=prefix><option>fio</option><option>piscine</option></select></label><label>Traitement<select id=treatment><option value=chlorine>Chlore / Brome</option><option value=electrolysis>Électrolyse</option><option value=oxygen>Oxygène actif</option><option value=none>Désactivé</option></select></label><label>Design entête<select id=design><option value=standard>Standard</option><option value=flowio>Flow.io</option></select></label><button id=theme>Changer de thème</button></nav>
<flowio-header-card></flowio-header-card><flowio-filtration-card></flowio-filtration-card><flowio-treatment-card></flowio-treatment-card><flowio-equipment-card></flowio-equipment-card><flowio-modes-card></flowio-modes-card><flowio-probes-card></flowio-probes-card><flowio-alarms-card></flowio-alarms-card><flowio-status-card></flowio-status-card><flowio-override-card></flowio-override-card><flowio-graph-card></flowio-graph-card></main><script type=module>
import '/demo/ha-switch.js';
import '/demo/ha-native-controls.js';
import '/dist/flowio-home-assistant-cards.js';
if(!customElements.get('ha-card'))customElements.define('ha-card',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:var(--ha-card-border-radius)}</style><slot></slot>';}});
const names={chlorine:'Chlore/Brome',electrolysis:'Electrolyse',oxygen:'Oxygène actif',none:'Désactivé'};
const entity=(state,unit,name,scale)=>({state,attributes:{...(unit?{unit_of_measurement:unit}:{}),...(name?{friendly_name:name}:{}),...(scale??{})}});
const attrs=(state,attributes)=>({state,attributes}),choice=(state,options)=>({state,attributes:{options}});
const prefixEl=document.querySelector('#prefix'),treatmentEl=document.querySelector('#treatment'),designEl=document.querySelector('#design');
const id=(domain,suffix)=>`${domain}.${prefixEl.value?prefixEl.value+'_':''}${suffix}`;
const cards={header:document.querySelector('flowio-header-card'),filtration:document.querySelector('flowio-filtration-card'),treatment:document.querySelector('flowio-treatment-card'),equipment:document.querySelector('flowio-equipment-card'),modes:document.querySelector('flowio-modes-card'),probes:document.querySelector('flowio-probes-card'),alarms:document.querySelector('flowio-alarms-card'),status:document.querySelector('flowio-status-card'),override:document.querySelector('flowio-override-card'),graph:document.querySelector('flowio-graph-card')};
function makeStates(){const defs={'sensor.io_wat_tmp':entity('25.2','°C','Flow.io Waveshare Eau',{min:0,max:40,state_class:'measurement'}),'sensor.io_air_tmp':entity('26.8','°C','Flow.io Waveshare Air',{min:-10,max:50,state_class:'measurement'}),'sensor.io_orp':entity('422','mV','Flow.io Waveshare ORP',{min:400,max:1000,state_class:'measurement'}),'sensor.io_ph':entity('7.2','','Flow.io Waveshare pH',{min:6,max:8.4,state_class:'measurement'}),'sensor.io_psi':entity('0.9','bar','Flow.io Waveshare PSI',{min:0.15,max:1.8,state_class:'measurement'}),'switch.io_flt_pmp':entity('on','','Flow.io Waveshare Filtration'),'switch.io_ph_pmp':entity('off','','Flow.io Waveshare Pompe pH'),'switch.io_chl_pmp':entity('off','','Flow.io Waveshare Pompe chlore'),'switch.io_robot':entity('off','','Flow.io Waveshare Robot'),'switch.io_fill_pmp':entity('off','','Flow.io Waveshare Remplissage'),'switch.io_lights':entity('on','','Flow.io Waveshare Éclairage'),'switch.io_wat_htr':entity('off','','Flow.io Waveshare Chauffage'),'switch.pl_modes_auto':entity('off','','Flow.io Waveshare Filtration auto'),'switch.pl_modes_winter':entity('off','','Flow.io Waveshare Hivernage'),'switch.pl_ph_auto_mode':entity('on','','Flow.io Waveshare pH auto'),'switch.pl_dis_auto':entity('on','','Flow.io Waveshare Désinfection auto'),'switch.pl_heat_auto':entity('off','','Flow.io Waveshare Chauffage auto'),'binary_sensor.alm_any_active':entity('off'),'sensor.alm_active_count':entity('0'),'binary_sensor.alm_1_active':entity('off','','Débit faible'),'binary_sensor.alm_3_active':entity('off','','Pression haute'),'select.pl_modes_dis':choice(names[treatmentEl.value],['Désactivé','Chlore/Brome','Electrolyse','Oxygène actif']),'sensor.pl_flt_start':entity('8','h'),'sensor.pl_flt_stop':entity('21','h'),'switch.pl_dis_auto':entity('off'),'number.pl_dis_setpoint':entity('700','mV'),'number.pl_dis_window':entity('60','min'),'select.pl_swg_ctrl':choice('Continu sur filtration',['Suivi consigne ORP','Continu sur filtration']),'number.pl_swg_dly_elec':entity('10','min'),'number.pl_swg_min_temp':entity('15','°C'),'number.pl_o2_vol':entity('50','m³'),'number.pl_o2_dose':entity('500','ml'),'number.pl_o2_split':entity('2'),'sensor.pl_o2_pending':entity('0','ml'),'sensor.data_112':entity('12.6','L','Flow.io Waveshare Bidon chlore',{min:0,max:20}),'sensor.data_130':entity('82.2','%','Flow.io Waveshare Remplissage chlore',{min:0,max:100}),'sensor.wifi_ip':entity('192.168.1.42','','Adresse IP'),'sensor.sys_hp_free':entity('142','kB','Mémoire libre'),'sensor.sys_upt_mn':entity('4320','min','Temps de fonctionnement'),'select.pdm_ovr_target':choice('Filtration',['Filtration','Pompe pH','Pompe désinfectant','Chauffage','Éclairage']),'number.pdm_ovr_min':entity('15','min'),'sensor.pdm_ovr_state':attrs('idle',{override_available:true,control_mode:'guided'}),'button.pdm_ovr_on':entity('unknown'),'button.pdm_ovr_off':entity('unknown'),'button.pdm_ovr_release':entity('unknown')};return Object.fromEntries(Object.entries(defs).map(([key,value])=>{const[domain,suffix]=key.split('.');return[id(domain,suffix),value];}));}
const callApi=async(method,path)=>{const id=new URLSearchParams(path.split('?')[1]).get('filter_entity_id'),now=Date.now();if(id.startsWith('switch.'))return[Array.from({length:72},(_,i)=>({entity_id:id,state:(i%12<6)?'on':'off',last_changed:new Date(now-(72-i)*600000).toISOString()}))];const base=id.endsWith('io_wat_tmp')?25:id.endsWith('io_air_tmp')?24:id.endsWith('io_orp')?700:id.endsWith('io_ph')?7.2:id.endsWith('io_psi')?0.9:26;const amp=id.endsWith('io_orp')?25:id.endsWith('io_ph')?0.3:id.endsWith('io_psi')?0.2:1.6;return[Array.from({length:72},(_,i)=>({entity_id:id,state:String(+(base+Math.sin(i/6)*amp).toFixed(2)),last_changed:new Date(now-(72-i)*600000).toISOString()}))];};
const callWS=async(msg)=>{const ids=msg.statistic_ids??[],start=Date.parse(msg.start_time),end=Date.parse(msg.end_time),step=msg.period==='hour'?3600000:300000,out={};for(const id of ids){const base=id.endsWith('io_wat_tmp')?25:id.endsWith('io_air_tmp')?24:id.endsWith('io_orp')?700:id.endsWith('io_ph')?7.2:id.endsWith('io_psi')?0.9:26,amp=id.endsWith('io_orp')?25:id.endsWith('io_ph')?0.3:id.endsWith('io_psi')?0.2:1.6;out[id]=[];for(let t=start;t<end;t+=step)out[id].push({start:t,end:t+step,mean:+(base+Math.sin(t/(6*step))*amp).toFixed(2)});}return out;};
const hass={states:makeStates(),callService:async()=>undefined,callApi,callWS};
function apply(){const states=makeStates(),prefix=prefixEl.value;cards.header.setConfig({entity_prefix:prefix,design:designEl.value});cards.filtration.setConfig({entity_prefix:prefix});cards.treatment.setConfig({entity_prefix:prefix});cards.equipment.setConfig({entity_prefix:prefix,columns:2,entities:[id('switch','io_flt_pmp'),id('switch','io_ph_pmp'),id('switch','io_chl_pmp'),id('switch','io_robot'),id('switch','io_fill_pmp'),id('switch','io_lights'),id('switch','io_wat_htr')]});cards.modes.setConfig({entity_prefix:prefix,columns:2,entities:[id('switch','pl_modes_auto'),id('switch','pl_modes_winter'),id('switch','pl_ph_auto_mode'),id('switch','pl_dis_auto'),id('switch','pl_heat_auto')]});cards.probes.setConfig({entity_prefix:prefix,columns:2,entities:[id('sensor','io_wat_tmp'),id('sensor','io_air_tmp'),id('sensor','io_ph'),id('sensor','io_orp'),id('sensor','io_psi'),id('sensor','data_112'),id('sensor','data_130')],items:{[id('sensor','io_ph')]:{mode:'gauge'},[id('sensor','io_orp')]:{name:'Redox',mode:'gauge'}}});cards.alarms.setConfig({entity_prefix:prefix});cards.status.setConfig({entity_prefix:prefix,items:['wifi_ip','sys_hp_free','sys_upt_mn']});cards.override.setConfig({entity_prefix:prefix,device:'Filtration'});cards.graph.setConfig({entity_prefix:prefix,entities:[id('sensor','io_wat_tmp')],hours_to_show:12,chart_type:'line',shades:{[id('switch','io_flt_pmp')]:''}});for(const card of Object.values(cards))card.hass={...hass,states};}
prefixEl.addEventListener('change',apply);treatmentEl.addEventListener('change',apply);designEl.addEventListener('change',apply);
document.querySelector('#theme').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));
apply();
</script></body></html>
