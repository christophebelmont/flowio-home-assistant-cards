<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1"><title>Flow.io · Petites cartes</title><style>
:root{color-scheme:light;--primary-text-color:#202124;--secondary-text-color:#60656d;--primary-color:#0074b8;--error-color:#b3261e;--divider-color:#d8dde3;--card-background-color:#fff;--secondary-background-color:#f3f5f7;--ha-card-border-radius:18px;background:#eef1f5;color:var(--primary-text-color);font-family:system-ui,sans-serif}
:root.dark{color-scheme:dark;--primary-text-color:#e6eaf0;--secondary-text-color:#a3adba;--primary-color:#69c7ff;--error-color:#ffb4ab;--divider-color:#39424e;--card-background-color:#202833;--secondary-background-color:#27313e;background:#141a22}body{margin:0;padding:20px}main{max-width:560px;margin:auto;display:flex;flex-direction:column;gap:20px}nav{display:flex;flex-wrap:wrap;gap:12px}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;padding:8px}
</style></head><body><main><h1>Flow.io · Petites cartes</h1><p>Données fictives, sans connexion HA ni MQTT. Aperçu des cartes indépendantes.</p><nav><label>Préfixe<select id=prefix><option>fio</option><option>piscine</option></select></label><label>Traitement<select id=treatment><option value=chlorine>Chlore / Brome</option><option value=electrolysis>Électrolyse</option><option value=oxygen>Oxygène actif</option><option value=none>Désactivé</option></select></label><label>Design entête<select id=design><option value=standard>Standard</option><option value=flowio>Flow.io</option></select></label><button id=theme>Changer de thème</button></nav>
<flowio-header-card></flowio-header-card><flowio-filtration-card></flowio-filtration-card><flowio-treatment-card></flowio-treatment-card></main><script type=module>
import '/demo/ha-switch.js';
import '/dist/flowio-home-assistant-cards.js';
if(!customElements.get('ha-card'))customElements.define('ha-card',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:var(--ha-card-border-radius)}</style><slot></slot>';}});
const names={chlorine:'Chlore/Brome',electrolysis:'Electrolyse',oxygen:'Oxygène actif',none:'Désactivé'};
const entity=(state,unit)=>({state,attributes:unit?{unit_of_measurement:unit}:{}}),choice=(state,options)=>({state,attributes:{options}}),id=(domain,suffix)=>`${domain}.${prefixEl.value?prefixEl.value+'_':''}${suffix}`;
const prefixEl=document.querySelector('#prefix'),treatmentEl=document.querySelector('#treatment'),designEl=document.querySelector('#design');
const header=document.querySelector('flowio-header-card'),filtration=document.querySelector('flowio-filtration-card'),treatment=document.querySelector('flowio-treatment-card');
function makeStates(){const defs={'sensor.io_wat_tmp':entity('25.2','°C'),'sensor.io_air_tmp':entity('26.8','°C'),'sensor.io_orp':entity('422','mV'),'sensor.io_ph':entity('7.2'),'sensor.io_psi':entity('0.9','bar'),'switch.pl_modes_auto':entity('off'),'binary_sensor.alm_any_active':entity('off'),'sensor.alm_active_count':entity('0'),'select.pl_modes_dis':choice(names[treatmentEl.value],['Désactivé','Chlore/Brome','Electrolyse','Oxygène actif']),'sensor.pl_flt_start':entity('8','h'),'sensor.pl_flt_stop':entity('21','h'),'switch.pl_dis_auto':entity('off'),'number.pl_dis_setpoint':entity('700','mV'),'number.pl_dis_window':entity('60','min'),'select.pl_swg_ctrl':choice('Continu sur filtration',['Suivi consigne ORP','Continu sur filtration']),'number.pl_swg_dly_elec':entity('10','min'),'number.pl_swg_min_temp':entity('15','°C'),'number.pl_o2_vol':entity('50','m³'),'number.pl_o2_dose':entity('500','ml'),'number.pl_o2_split':entity('2'),'sensor.pl_o2_pending':entity('0','ml')};return Object.fromEntries(Object.entries(defs).map(([key,value])=>{const[domain,suffix]=key.split('.');return[id(domain,suffix),value];}));}
const hass={states:makeStates(),callService:async()=>undefined};
function apply(){const states=makeStates();header.setConfig({entity_prefix:prefixEl.value,design:designEl.value});header.hass={...hass,states};filtration.setConfig({entity_prefix:prefixEl.value});filtration.hass={...hass,states};treatment.setConfig({entity_prefix:prefixEl.value});treatment.hass={...hass,states};}
prefixEl.addEventListener('change',apply);treatmentEl.addEventListener('change',apply);designEl.addEventListener('change',apply);
document.querySelector('#theme').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));
apply();
</script></body></html>
